[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counso-benchmark"
version = "0.2.2"
description = "Artifact-based agent evaluation for office workflows, file tools, and generative UI"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/0xMoji/COUNSO-Benchmark"
Documentation = "https://github.com/0xMoji/COUNSO-Benchmark/blob/main/AGENT-START.md"

[tool.setuptools]
packages = ["counso_bench"]

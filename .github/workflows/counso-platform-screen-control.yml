name: Controlled synthetic UI acceptance
# Authority copy; publisher maps these identical bytes to the active root workflow.
# Original probe source/workflow is preserved. No new branch or extra Actions job.
on:
  push:
    branches: ['eval/counso-ui-probe']
    paths:
      - 'platform-screen-control/**'
      - '.github/workflows/counso-platform-screen-control.yml'
permissions:
  contents: read
concurrency:
  group: controlled-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controls:
    if: github.repository == '0xMoji/counso-benchmark-reconstructed' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform-screen-control
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Start combined setup and npm 60-second budget
        run: printf 'CONTROL_SETUP_STARTED=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        timeout-minutes: 1
        with:
          node-version: '24.16.0'
          check-latest: false
      - name: Once-only exact official-registry runtime dependencies
        timeout-minutes: 1
        working-directory: platform-screen-control/runtime
        run: |
          remaining=$((60 - $(date +%s) + CONTROL_SETUP_STARTED))
          test "$remaining" -gt 0
          timeout --signal=TERM --kill-after=5s "${remaining}s" npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Prefixed committed source gate and official preinstalled Chrome
        timeout-minutes: 1
        env:
          CI_EVIDENCE_COMMIT: ${{ github.sha }}
          CI_EVIDENCE_RUN_ID: ${{ github.run_id }}
        run: |
          timeout --signal=TERM --kill-after=5s 55s node runtime/ci-entry.mjs --verify
          command -v google-chrome
          google-chrome --version
          test -x /opt/google/chrome/chrome
          sha256sum /opt/google/chrome/chrome
      # Dashboard reference/mutations inherit existing control-v3 real evidence.
      # Prospective contract-equivalence review is required; historical files stay unchanged.
      - name: Planner reference phase
        timeout-minutes: 4
        env:
          CI_EVIDENCE_COMMIT: ${{ github.sha }}
          CI_EVIDENCE_RUN_ID: ${{ github.run_id }}
          CI_BROWSER_CHANNEL: chrome
        run: timeout --signal=TERM --kill-after=5s 210s node runtime/ci-entry.mjs --phase reference-edit
      - name: Three declared planner mutations phase
        timeout-minutes: 2
        env:
          CI_EVIDENCE_COMMIT: ${{ github.sha }}
          CI_EVIDENCE_RUN_ID: ${{ github.run_id }}
          CI_BROWSER_CHANNEL: chrome
        run: timeout --signal=TERM --kill-after=5s 90s node runtime/ci-entry.mjs --phase planner-mutations
      - name: Preserve all original phase evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-controls-${{ github.run_id }}
          path: platform-screen-control/ci-results/
          retention-days: 7
          if-no-files-found: error

name: deterministic-validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m counso_bench validate
      - run: python -m unittest discover -s tests -v
      - run: python -m counso_bench selftest --output "${{ runner.temp }}/counso-selftest"
  artifact-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-calc libreoffice-impress
      - run: python -m pip install openpyxl
      - run: npm install --prefix /tmp/counso-browser playwright@1.62.1 pptxgenjs@4.0.1
      - run: /tmp/counso-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          COUNSO_ARTIFACT_INTEGRATION: '1'
          COUNSO_SOFFICE: /usr/bin/soffice
          NODE_PATH: /tmp/counso-browser/node_modules
      - run: python -m counso_bench selftest --output /tmp/counso-full-controls
        env:
          COUNSO_SOFFICE: /usr/bin/soffice
          NODE_PATH: /tmp/counso-browser/node_modules
      - run: python -c "import json; assert json.load(open('/tmp/counso-full-controls/selftest-summary.json'))['fully_verified']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-controls-not-model-results
          path: /tmp/counso-full-controls
          include-hidden-files: true
